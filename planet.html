<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Lab — Patrick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Fira+Code:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f4f2ff;
  --ink-2: rgba(236,232,255,.72);
  --ink-3: rgba(220,214,255,.5);
  --peri: #6f78ff;
  --peri-2: #8d94ff;
  --bronze: #cda87d;
  --frost: #dbe4ee;
  --bg: #0d0830;
  --bg-2: #14103a;
  --line: rgba(196,178,255,.15);
  --glass: rgba(20,13,56,.55);
  --glass-strong: rgba(20,13,56,.85);
  --accent-glow: rgba(141,148,255,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at top, #151038 0%, var(--bg) 40%, #080418 100%);
  color: var(--ink);
  font-family: 'Inter Tight', system-ui, sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'Fira Code', monospace; }
.serif { font-family: 'Instrument Serif', serif; font-style: italic; }

/* 顶部导航 */
header.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 18px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(13,8,48,.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 13px;
  transition: color .25s;
}
.back-link:hover { color: var(--frost); }
.back-link svg { width: 14px; height: 14px; }
.page-title {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 22px;
  letter-spacing: .02em;
  background: linear-gradient(90deg, #a5b8ff, #d4a7ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.top-actions { display: flex; gap: 10px; }
.top-btn {
  background: rgba(111,120,255,.12);
  border: 1px solid rgba(141,148,255,.28);
  color: var(--frost);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-family: 'Fira Code', monospace;
  letter-spacing: .04em;
  cursor: pointer;
  transition: all .25s;
}
.top-btn:hover {
  background: rgba(111,120,255,.25);
  box-shadow: 0 0 18px var(--accent-glow);
}
.top-btn.primary {
  background: linear-gradient(135deg, rgba(111,120,255,.4), rgba(205,168,125,.25));
  border-color: rgba(205,168,125,.45);
}
.top-btn.primary:hover {
  background: linear-gradient(135deg, rgba(111,120,255,.55), rgba(205,168,125,.4));
  box-shadow: 0 0 24px rgba(205,168,125,.4);
}

/* 主体三栏 */
main.lab {
  max-width: 1600px;
  margin: 0 auto;
  padding: 24px 32px 120px;
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
  grid-template-rows: auto auto;
  gap: 24px;
}

/* 卡片通用 */
.panel {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 16px;
  backdrop-filter: blur(20px) saturate(1.3);
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.04);
  overflow: hidden;
}
.panel-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-title {
  font-size: 11px;
  font-family: 'Fira Code', monospace;
  letter-spacing: .14em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.panel-body { padding: 20px; }

/* 左侧：星球 */
#planet-panel { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; }
#planet-stage {
  position: relative;
  aspect-ratio: 1 / 1;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}
#planet-canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
#planet-canvas.painting { cursor: crosshair; }
#planet-canvas.grabbing { cursor: grabbing; }

/* 工具栏 */
.brush-bar {
  padding: 12px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.brush-btn {
  background: rgba(111,120,255,.08);
  border: 1px solid rgba(141,148,255,.2);
  color: var(--ink-2);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 12px;
  font-family: 'Fira Code', monospace;
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.brush-btn:hover { color: var(--frost); border-color: rgba(141,148,255,.5); }
.brush-btn.active {
  background: rgba(111,120,255,.3);
  border-color: var(--peri-2);
  color: #fff;
  box-shadow: 0 0 16px var(--accent-glow);
}
.brush-btn.danger.active {
  background: rgba(255,120,150,.22);
  border-color: rgba(255,120,150,.6);
  box-shadow: 0 0 16px rgba(255,120,150,.4);
}
.brush-btn.gold.active {
  background: rgba(205,168,125,.25);
  border-color: var(--bronze);
  box-shadow: 0 0 16px rgba(205,168,125,.4);
}
.brush-size {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--ink-3);
  font-family: 'Fira Code', monospace;
}
.brush-size input[type="range"] { width: 100px; }

/* 右侧：控制 */
#controls-panel { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; max-height: 700px; }
#controls-body { overflow-y: auto; flex: 1; }
#controls-body::-webkit-scrollbar { width: 4px; }
#controls-body::-webkit-scrollbar-thumb { background: rgba(205,190,255,.2); border-radius: 2px; }

.control-group { margin-bottom: 24px; }
.control-group-title {
  font-size: 10px;
  font-family: 'Fira Code', monospace;
  letter-spacing: .12em;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.control-group-title::before {
  content: '';
  display: block;
  width: 3px;
  height: 10px;
  background: var(--peri-2);
  border-radius: 2px;
}
.control-group-title.derived::before { background: var(--bronze); }

.ctrl-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.ctrl-label {
  font-size: 12px;
  color: var(--ink-2);
  min-width: 88px;
}
.ctrl-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 2px;
  background: rgba(205,190,255,.12);
  outline: none;
  cursor: pointer;
}
.ctrl-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--peri-2);
  box-shadow: 0 0 12px var(--peri-2);
  cursor: grab;
  transition: transform .15s;
}
.ctrl-row input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }
.ctrl-row input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--peri-2);
  border: none;
  box-shadow: 0 0 12px var(--peri-2);
}
.ctrl-value {
  font-family: 'Fira Code', monospace;
  font-size: 12px;
  color: var(--frost);
  min-width: 70px;
  text-align: right;
  transition: color .2s;
}

/* 元素混合器 */
.gas-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.gas-label {
  font-size: 12px;
  font-family: 'Fira Code', monospace;
  color: var(--ink-2);
  min-width: 40px;
}
.gas-row input[type="range"] { flex: 1; }
.gas-value {
  font-family: 'Fira Code', monospace;
  font-size: 11px;
  color: var(--frost);
  min-width: 56px;
  text-align: right;
}
.gas-sum {
  display: flex;
  justify-content: space-between;
  padding-top: 8px;
  margin-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 11px;
  font-family: 'Fira Code', monospace;
  color: var(--ink-3);
}

/* 推导值 */
.derived-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.derived-item {
  background: rgba(205,168,125,.06);
  border: 1px solid rgba(205,168,125,.2);
  border-radius: 10px;
  padding: 12px;
  position: relative;
  transition: all .3s;
}
.derived-item.flash {
  background: rgba(205,168,125,.16);
  border-color: var(--bronze);
  box-shadow: 0 0 20px rgba(205,168,125,.3);
}
.derived-label {
  font-size: 10px;
  color: var(--ink-3);
  font-family: 'Fira Code', monospace;
  letter-spacing: .05em;
}
.derived-value {
  font-size: 18px;
  color: var(--bronze);
  font-family: 'Fira Code', monospace;
  margin-top: 4px;
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.derived-arrow {
  font-size: 11px;
  opacity: 0;
  transition: opacity .3s;
}
.derived-arrow.show { opacity: 1; }
.derived-arrow.up { color: #7cf0bd; }
.derived-arrow.down { color: #ff8fd8; }

/* 底部宜居度 + 沙粒图 */
#bottom-panel {
  grid-column: 1 / -1;
  grid-row: 2;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 0;
}
.habitability-block {
  padding: 28px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.habitability-label {
  font-family: 'Fira Code', monospace;
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.habitability-score {
  font-size: 64px;
  font-weight: 300;
  line-height: 1;
  color: var(--frost);
  transition: color .4s;
}
.habitability-tier {
  margin-top: 10px;
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  font-family: 'Fira Code', monospace;
  font-size: 11px;
  letter-spacing: .05em;
  border: 1px solid;
  align-self: flex-start;
  transition: all .3s;
}
.chart-block { padding: 20px; }
#chart-canvas { width: 100%; height: 220px; display: block; }

/* Toast */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--glass-strong);
  border: 1px solid rgba(205,190,255,.4);
  color: var(--frost);
  padding: 12px 26px;
  border-radius: 12px;
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  letter-spacing: .08em;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 12px 40px rgba(110,90,240,.5);
  transition: all .35s cubic-bezier(.2,.8,.2,1);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 移动端 */
@media (max-width: 980px) {
  main.lab { grid-template-columns: 1fr; padding: 16px 16px 80px; }
  #planet-panel { grid-row: 1; }
  #controls-panel { grid-row: 2; max-height: none; }
  #bottom-panel { grid-row: 3; grid-template-columns: 1fr; }
  .habitability-block { border-right: none; border-bottom: 1px solid var(--line); }
  header.top-bar { padding: 14px 18px; }
  .page-title { font-size: 18px; }
  .top-btn { padding: 6px 12px; font-size: 11px; }
  .habitability-score { font-size: 52px; }
}
  /* 👇 转场遮罩样式 */
#noise-transition-canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 9999999; pointer-events: auto;
}
.back-link {
    cursor: pointer; background: none; border: none; font-family: inherit;
}
</style>
</head>
<body>
      <canvas id="noise-transition-canvas"></canvas>

<header class="top-bar">
<!-- 👇 把原来的 <a> 换成 <button>，加上 id="btn-back" -->
<button id="btn-back" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Home
</button>
  <div class="page-title">Planet Lab · 星球实验室</div>
  <div class="top-actions">
    <button class="top-btn" id="btn-reset">重置</button>
    <button class="top-btn" id="btn-save">保存</button>
    <button class="top-btn primary" id="btn-share">分享</button>
  </div>
</header>

<main class="lab">

  <!-- 左侧：星球渲染 -->
  <section class="panel" id="planet-panel">
    <div class="panel-head">
      <span class="panel-title">Planet · 星球</span>
      <span class="mono" style="font-size:10px; color:var(--ink-3);" id="planet-status">点击星球绘制 · 右键或拖拽旋转视角</span>
    </div>
    <div id="planet-stage">
      <canvas id="planet-canvas"></canvas>
    </div>
    <div class="brush-bar">
      <button class="brush-btn" data-brush="land">🌍 画陆地</button>
      <button class="brush-btn" data-brush="ocean">🌊 画海洋</button>
      <button class="brush-btn danger" data-brush="erase">⌫ 平滑擦除</button>
      <button class="brush-btn" data-brush="none">↻ 查看模式</button>
      <div class="brush-size">
        <span>笔刷</span>
        <input type="range" id="brush-size" min="0.01" max="0.15" step="0.005" value="0.05">
      </div>
    </div>
  </section>

  <!-- 右侧：控制面板 -->
  <section class="panel" id="controls-panel">
    <div class="panel-head">
      <span class="panel-title">Control · 参数</span>
    </div>
    <div class="panel-body" id="controls-body">

      <!-- 直接控制 -->
      <div class="control-group">
        <div class="control-group-title">直接控制 · Direct</div>

        <div class="ctrl-row">
          <span class="ctrl-label">表面温度</span>
          <input type="range" id="ctrl-temperature" min="-80" max="200" step="1" value="15">
          <span class="ctrl-value" data-value="temperature">15°C</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">大气压力</span>
          <input type="range" id="ctrl-atmosphere" min="0" max="5" step="0.05" value="1">
          <span class="ctrl-value" data-value="atmosphere">1.00 atm</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">表面重力</span>
          <input type="range" id="ctrl-gravity" min="0.1" max="3" step="0.05" value="1">
          <span class="ctrl-value" data-value="gravity">1.00 g</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">辐射水平</span>
          <input type="range" id="ctrl-radiation" min="0" max="100" step="1" value="12">
          <span class="ctrl-value" data-value="radiation">12%</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">自转速度</span>
          <input type="range" id="ctrl-spin" min="0" max="3" step="0.05" value="1">
          <span class="ctrl-value" data-value="spin">1.00×</span>
        </div>
      </div>

      <!-- 元素 DIY -->
            <!-- 元素 DIY -->
      <div class="control-group">
        <div class="control-group-title">大气成分 · Atmosphere Mix</div>

        <div class="gas-row">
          <span class="gas-label">O₂</span>
          <button class="lock-btn" data-lock="O2">🔓</button>
          <input type="range" id="gas-O2" min="0" max="99" step="0.1" value="21">
          <span class="gas-value" data-gas="O2">21.0%</span>
        </div>
        <div class="gas-row">
          <span class="gas-label">N₂</span>
          <button class="lock-btn" data-lock="N2">🔓</button>
          <input type="range" id="gas-N2" min="0" max="99" step="0.1" value="78">
          <span class="gas-value" data-gas="N2">78.0%</span>
        </div>
        <div class="gas-row">
          <span class="gas-label">CO₂</span>
          <button class="lock-btn" data-lock="CO2">🔓</button>
          <input type="range" id="gas-CO2" min="0" max="99" step="0.1" value="0.04">
          <span class="gas-value" data-gas="CO2">0.0%</span>
        </div>
        <div class="gas-row">
          <span class="gas-label">Ar</span>
          <button class="lock-btn" data-lock="Ar">🔓</button>
          <input type="range" id="gas-Ar" min="0" max="99" step="0.1" value="0.92">
          <span class="gas-value" data-gas="Ar">0.9%</span>
        </div>

        <div class="gas-sum">
          <span>总和</span>
          <span id="gas-sum-val">100.0%</span>
        </div>
      </div>


      <!-- 联动推导 -->
      <div class="control-group">
        <div class="control-group-title derived">联动推导 · Derived</div>
        <div class="derived-grid">
          <div class="derived-item" data-derived="magnetic">
            <div class="derived-label">磁场保护</div>
            <div class="derived-value">
              <span class="dv-num">0.00</span>
              <span class="derived-arrow">↑</span>
            </div>
          </div>
          <div class="derived-item" data-derived="tempVariation">
            <div class="derived-label">昼夜温差</div>
            <div class="derived-value">
              <span class="dv-num">0.00</span>
              <span class="derived-arrow">↑</span>
            </div>
          </div>
          <div class="derived-item" data-derived="light">
            <div class="derived-label">光照强度</div>
            <div class="derived-value">
              <span class="dv-num">0.00</span>
              <span class="derived-arrow">↑</span>
            </div>
          </div>
          <div class="derived-item" data-derived="geological">
            <div class="derived-label">地质稳定</div>
            <div class="derived-value">
              <span class="dv-num">0.00</span>
              <span class="derived-arrow">↑</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- 底部：宜居度 + 沙粒柱状图 -->
  <section class="panel" id="bottom-panel">
    <div class="habitability-block">
      <div class="habitability-label">HABITABILITY INDEX</div>
      <div class="habitability-score" id="hab-score">—</div>
      <div class="habitability-tier" id="hab-tier">—</div>
    </div>
    <div class="chart-block">
      <canvas id="chart-canvas"></canvas>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Planet Lab — 完整实现
   技术栈：WebGL2（星球点阵）+ Canvas 2D（粒子柱状图）
   ============================================================ */
(function() {
'use strict';

// ============================================================
// 1. 常量与状态
// ============================================================
const TERRAIN_W = 1024;
const TERRAIN_H = 512;
const TERRAIN_SIZE = TERRAIN_W * TERRAIN_H;

const LABELS_10 = [
  '温度', '液态水', '大气', 'O₂', '重力', '辐射',
  '磁场', '温差', '光照', '地质'
];

const state = {
  temperature: 15,     // °C, -80 ~ 200
  atmosphere: 1.0,     // atm, 0 ~ 5
  gravity: 1.0,        // g, 0.1 ~ 3
  radiation: 12,       // %, 0 ~ 100
  spinSpeed: 1.0,      // 0 ~ 3
  gases: { O2: 21, N2: 78, CO2: 0.04, Ar: 0.92 }
};

const GAS_MIN = { O2: 0.01, N2: 0.01, CO2: 0.01, Ar: 0.01 };

// 地形：R 通道 0~255
const terrainData = new Uint8Array(TERRAIN_SIZE);

// 相机
const camera = {
  yaw: 0,
  pitch: 0.15,
  distance: 2.8,
  fov: 45
};

let autoRotate = true;
const AUTO_ROTATE_SPEED = 0.12; // rad/s

// 笔刷
let brushMode = 'none';   // 'land' | 'ocean' | 'erase' | 'none'
let brushSize = 0.05;
let isPainting = false;
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let lastDragPos = { x: 0, y: 0 };
let lastPaintUV = null;

// 上一帧的派生值（用于箭头动画）
const prevDerived = { magnetic: 0, tempVariation: 0, light: 0, geological: 0 };

// ============================================================
// 2. 默认地形生成（噪声合成陆地/海洋）
// ============================================================
function generateDefaultTerrain() {
  for (let y = 0; y < TERRAIN_H; y++) {
    const lat = (y / TERRAIN_H) * Math.PI - Math.PI / 2;
    const cosLat = Math.cos(lat);
    for (let x = 0; x < TERRAIN_W; x++) {
      const lon = (x / TERRAIN_W) * Math.PI * 2;
      const n1 = Math.sin(lon * 3 + 1.2) * Math.cos(lat * 4 + 0.5);
      const n2 = Math.sin(lon * 5 - 2.1) * Math.cos(lat * 3 + 1.8);
      const n3 = Math.sin(lon * 2 + 0.7) * Math.cos(lat * 6);
      const noise = (n1 + n2 * 0.6 + n3 * 0.4) / 2.0;
      const isLand = noise > 0.08 && Math.abs(cosLat) > 0.12;
      terrainData[y * TERRAIN_W + x] = isLand ? 220 : 20;
    }
  }
}

// ============================================================
// 3. WebGL2 星球渲染
// ============================================================
const canvas = document.getElementById('planet-canvas');
const gl = canvas.getContext('webgl2', {
  alpha: true,
  antialias: true,
  premultipliedAlpha: false
});

if (!gl) {
  document.body.innerHTML = '<div style="padding:40px; color:#fff; font-family:monospace;">你的浏览器不支持 WebGL2，无法使用星球实验室。</div>';
  return;
}

const VS_SRC = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FS_SRC = `#version 300 es
precision highp float;

uniform vec2 uRes;
uniform float uTime;
uniform sampler2D uTerrain;
uniform vec2 uRot;        // yaw, pitch
uniform float uTemperature;  // normalized -1 ~ 1
uniform float uAtmosphere;   // 0 ~ 5
uniform float uRadiation;    // 0 ~ 1
uniform vec3 uAccent;
uniform vec2 uBrushUV;
uniform float uBrushRadius;
uniform float uBrushActive;
uniform float uBrushValue;  // 0 = ocean (blue preview), 1 = land (gold preview)

out vec4 outColor;

const float PI = 3.14159265;
const float TAU = 6.28318530;

mat2 rot2(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

vec2 normalToUV(vec3 n) {
  float lon = atan(n.z, n.x);
  float lat = asin(clamp(n.y, -1.0, 1.0));
  return vec2(lon / TAU + 0.5, lat / PI + 0.5);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = (uv - 0.5) * 2.0;
  float aspect = uRes.x / uRes.y;
  p.x *= aspect;

  float R = 0.82;
  float d2 = dot(p, p);

  // 星球外：大气辉光
  if (d2 > R * R) {
    float dist = sqrt(d2) - R;
    float glow = exp(-dist * 6.0);
    float atmoGlow = glow * (0.08 + uAtmosphere * 0.06);
    outColor = vec4(uAccent * atmoGlow, atmoGlow * 0.8);
    return;
  }

  // 球内：法线
  float z = sqrt(R * R - d2);
  vec3 normal = normalize(vec3(p, z));

  // 应用旋转（球体自转）
  normal.xz = rot2(uRot.x) * normal.xz;
  normal.yz = rot2(uRot.y) * normal.yz;

  // 法线 → UV
  vec2 sphereUV = normalToUV(normal);

  // 采样地形
  float land = texture(uTerrain, sphereUV).r;

  // 基色
  float temp = uTemperature; // -1 cold .. 0 earth .. 1 hot
  vec3 oceanCold = vec3(0.12, 0.22, 0.55);
  vec3 oceanHot = vec3(0.35, 0.45, 0.55);
  vec3 landCold = vec3(0.55, 0.62, 0.72);
  vec3 landHot = vec3(0.72, 0.38, 0.22);
  vec3 ocean = mix(oceanCold, oceanHot, clamp(temp * 0.5 + 0.5, 0.0, 1.0));
  vec3 landCol = mix(landCold, landHot, clamp(temp * 0.5 + 0.5, 0.0, 1.0));
  vec3 baseColor = mix(ocean, landCol, land);

  // Lambert 光照（光源左上前方）
  vec3 lightDir = normalize(vec3(-0.45, 0.6, 0.65));
  float lambert = max(dot(normal, lightDir), 0.0);
  float ambient = 0.32;
  vec3 color = baseColor * (ambient + lambert * 0.95);

  // 边缘光
  float rim = pow(1.0 - z / R, 2.5);
  color += uAccent * rim * 0.55 * (0.5 + uAtmosphere * 0.15);

  // 辐射脉冲
  if (uRadiation > 0.2) {
    float pulse = 0.5 + 0.5 * sin(uTime * 3.0);
    color += vec3(1.0, 0.25, 0.3) * (uRadiation - 0.2) * pulse * rim * 0.6;
  }

  // 笔刷预览
  if (uBrushActive > 0.5) {
    // 球面距离（考虑纬度压缩）
    float lat = (sphereUV.y - 0.5) * PI;
    vec2 duv = sphereUV - uBrushUV;
    duv.x *= cos(lat);   // 经度压缩
    duv.y *= 2.0;        // 纬度相对经度是两倍
    float dist = length(duv);
    float ring = smoothstep(uBrushRadius * 1.05, uBrushRadius * 0.95, dist);
    vec3 brushColor = mix(vec3(0.3, 0.6, 1.0), vec3(1.0, 0.85, 0.5), uBrushValue);
    color = mix(color, brushColor, ring * 0.5);
  }

  // 大气散射高光
  color += vec3(0.7, 0.8, 1.0) * pow(lambert, 4.0) * uAtmosphere * 0.08;

  outColor = vec4(color, 1.0);
}
`;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('Shader error:', gl.getShaderInfoLog(s));
    gl.deleteShader(s);
    return null;
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VS_SRC));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FS_SRC));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error('Program link error:', gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Uniform 位置
const U = {};
['uRes','uTime','uTerrain','uRot','uTemperature','uAtmosphere','uRadiation',
 'uAccent','uBrushUV','uBrushRadius','uBrushActive','uBrushValue'].forEach(name => {
  U[name] = gl.getUniformLocation(prog, name);
});

// 地形纹理
const terrainTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, terrainTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// 地形 ImageData（用于上传）
const terrainCanvas = document.createElement('canvas');
terrainCanvas.width = TERRAIN_W;
terrainCanvas.height = TERRAIN_H;
const terrainCtx = terrainCanvas.getContext('2d');
const terrainImage = terrainCtx.createImageData(TERRAIN_W, TERRAIN_H);

function uploadTerrain() {
  for (let i = 0; i < TERRAIN_SIZE; i++) {
    const v = terrainData[i];
    terrainImage.data[i * 4] = v;
    terrainImage.data[i * 4 + 1] = v;
    terrainImage.data[i * 4 + 2] = v;
    terrainImage.data[i * 4 + 3] = 255;
  }
  terrainCtx.putImageData(terrainImage, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, terrainTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, terrainCanvas);
  gl.generateMipmap(gl.TEXTURE_2D);
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

// ============================================================
// 4. 屏幕坐标 ↔ 球面 UV
// ============================================================
// 球心在原点，半径 1，相机在 (0,0,distance) 看向原点
function screenToSphereUV(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const nx = (clientX - rect.left) / rect.width * 2 - 1;
  const ny = -((clientY - rect.top) / rect.height * 2 - 1);

  const aspect = rect.width / rect.height;
  const tanHalfFov = Math.tan(camera.fov * 0.5 * Math.PI / 180);

  // 射线方向（世界空间，相机固定看向原点）
  // 相机看向 -z 方向（从 (0,0,d) 看向原点）
  const rx = nx * aspect * tanHalfFov;
  const ry = ny * tanHalfFov;
  const rz = -1;

  // 相机距离球心 distance，球半径 1
  // 射线起点在相机位置 (0,0,distance)，方向 (rx, ry, rz) 归一化
  const len = Math.hypot(rx, ry, rz);
  const dx = rx / len;
  const dy = ry / len;
  const dz = rz / len;
  const cx = 0;
  const cy = 0;
  const cz = camera.distance;

  // 与球求交：|o + t*d|² = 1
  // b = 2*dot(o, d), c = dot(o,o) - 1
  const b = 2 * (cx * dx + cy * dy + cz * dz);
  const cVal = (cx * cx + cy * cy + cz * cz) - 1;
  const disc = b * b - 4 * cVal;

  if (disc < 0) return null;

  const t = (-b - Math.sqrt(disc)) / 2;
  if (t < 0) return null;

  // 世界交点
  const px = cx + dx * t;
  const py = cy + dy * t;
  const pz = cz + dz * t;

  // 世界法线 = 交点（球心原点，半径 1）
  let nx3 = px, ny3 = py, nz3 = pz;

  // 逆旋转到模型空间
  const cyaw = Math.cos(camera.yaw), syaw = Math.sin(camera.yaw);
  // shader: normal.xz = rot2(yaw) * normal.xz
  // rot2(yaw) = mat2(cy, -sy, sy, cy) → (x', z') = (cy*x + sy*z, -sy*x + cy*z)
  // 逆：x = cy*x' - sy*z', z = sy*x' + cy*z'
  let mx = cyaw * nx3 - syaw * nz3;
  let mz = syaw * nx3 + cyaw * nz3;
  let my = ny3;

  const cpitch = Math.cos(camera.pitch), spitch = Math.sin(camera.pitch);
  // shader: normal.yz = rot2(pitch) * normal.yz
  // rot2(pitch) = mat2(cp, -sp, sp, cp) → (y', z') = (cp*y + sp*z, -sp*y + cp*z)
  // 逆：y = cp*y' - sp*z', z = sp*y' + cp*z'
  const my2 = cpitch * my - spitch * mz;
  const mz2 = spitch * my + cpitch * mz;

  // 模型法线 → UV
  const lon = Math.atan2(mz2, mx);
  const lat = Math.asin(Math.max(-1, Math.min(1, my2)));
  return {
    u: lon / (Math.PI * 2) + 0.5,
    v: lat / Math.PI + 0.5
  };
}

// ============================================================
// 5. 地形笔刷
// ============================================================
function paintBrush(cu, cv, radius, value) {
  // cu, cv ∈ [0, 1]
  const centerX = cu * TERRAIN_W;
  const centerY = cv * TERRAIN_H;
  const rpx = Math.max(1, Math.floor(radius * TERRAIN_W));
  const rpy = Math.max(1, Math.floor(radius * TERRAIN_H));

  for (let dy = -rpy; dy <= rpy; dy++) {
    for (let dx = -rpx; dx <= rpx; dx++) {
      const lat = ((centerY + dy) / TERRAIN_H) * Math.PI - Math.PI / 2;
      const cosLat = Math.max(0.05, Math.cos(lat));

      // 球面距离（经度压缩）
      const distLon = (dx / TERRAIN_W) * Math.PI * 2 * cosLat;
      const distLat = (dy / TERRAIN_H) * Math.PI;
      const dist = Math.sqrt(distLon * distLon + distLat * distLat);

      if (dist > radius) continue;

      // 边缘柔化
      const t = 1 - dist / radius;
      const soft = t * t * (3 - 2 * t); // smoothstep

      // 经度环绕
      let x = Math.round(centerX + dx);
      x = ((x % TERRAIN_W) + TERRAIN_W) % TERRAIN_W;
      // 纬度裁剪
      const y = Math.round(centerY + dy);
      if (y < 0 || y >= TERRAIN_H) continue;

      const idx = y * TERRAIN_W + x;
      let target;
      if (value === 'erase') {
        // 平滑擦除：按 soft 力度向周围平均靠拢
        const oldV = terrainData[idx];
        const avg = 128; // 向中间灰度融合，实际效果是软边
        target = oldV * (1 - soft * 0.35) + avg * (soft * 0.35);
        terrainData[idx] = Math.round(target);
      } else {
        const v = value === 'land' ? 220 : 20;
        terrainData[idx] = Math.round(terrainData[idx] * (1 - soft) + v * soft);
      }
    }
  }
}

// ============================================================
// 6. 触发渲染
// ============================================================
let needsRender = true;
let lastTime = performance.now();
let timeAccum = 0;

function requestRender() {
  needsRender = true;
}

function drawPlanet() {
  resizeCanvas();
  gl.useProgram(prog);
  gl.bindVertexArray(vao);

  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, timeAccum);
  gl.uniform2f(U.uRot, camera.yaw, camera.pitch);
  gl.uniform1f(U.uTemperature, state.temperature / 100);
  gl.uniform1f(U.uAtmosphere, state.atmosphere);
  gl.uniform1f(U.uRadiation, state.radiation / 100);
  gl.uniform3f(U.uAccent, 0.55, 0.58, 1.0);

  gl.uniform1i(U.uTerrain, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, terrainTex);

  // 笔刷预览
  if (lastPaintUV && brushMode !== 'none') {
    gl.uniform2f(U.uBrushUV, lastPaintUV.u, lastPaintUV.v);
    gl.uniform1f(U.uBrushRadius, brushSize);
    gl.uniform1f(U.uBrushActive, 1.0);
    gl.uniform1f(U.uBrushValue, brushMode === 'land' ? 1.0 : 0.0);
  } else {
    gl.uniform1f(U.uBrushActive, 0.0);
  }

  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  timeAccum += dt;

  // 自转
  if (autoRotate && !isDragging && !isPainting) {
    camera.yaw += AUTO_ROTATE_SPEED * state.spinSpeed * dt;
    needsRender = true;
  }

  if (needsRender) {
    drawPlanet();
    needsRender = false;
  }
}

// ============================================================
// 7. 交互：星球绘制
// ============================================================
canvas.addEventListener('pointerdown', (e) => {
  const uv = screenToSphereUV(e.clientX, e.clientY);
  if (!uv) return;

  if (e.button === 0 && brushMode !== 'none') {
    // 左键绘制
    isPainting = true;
    autoRotate = false;
    lastPaintUV = uv;
    paintBrush(uv.u, uv.v, brushSize, brushMode);
    uploadTerrain();
    updateHabitability();
    requestRender();
    canvas.setPointerCapture(e.pointerId);
  } else {
    // 拖拽旋转
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    lastDragPos = { x: e.clientX, y: e.clientY };
    canvas.classList.add('grabbing');
    autoRotate = false;
    canvas.setPointerCapture(e.pointerId);
  }
});

canvas.addEventListener('pointermove', (e) => {
  // 更新笔刷预览
  if (brushMode !== 'none') {
    const uv = screenToSphereUV(e.clientX, e.clientY);
    lastPaintUV = uv;
    if (uv) {
      requestRender();
    }
  }

  if (isPainting && brushMode !== 'none') {
    const uv = screenToSphereUV(e.clientX, e.clientY);
    if (uv) {
      paintBrush(uv.u, uv.v, brushSize, brushMode);
      uploadTerrain();
      updateHabitability();
      requestRender();
    }
  } else if (isDragging) {
    const dx = e.clientX - lastDragPos.x;
    const dy = e.clientY - lastDragPos.y;
    camera.yaw += dx * 0.008;
    camera.pitch = Math.max(-1.2, Math.min(1.2, camera.pitch + dy * 0.008));
    lastDragPos = { x: e.clientX, y: e.clientY };
    requestRender();
  }
});

function endPointer() {
  isPainting = false;
  isDragging = false;
  canvas.classList.remove('grabbing');
  // 笔刷模式下保持暂停自转；查看模式下恢复
  if (brushMode === 'none') autoRotate = true;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => {
  if (!isPainting) {
    lastPaintUV = null;
    requestRender();
  }
});

// 阻止右键菜单
canvas.addEventListener('contextmenu', e => e.preventDefault());

// 滚轮缩放距离
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camera.distance = Math.max(1.6, Math.min(5.0, camera.distance + e.deltaY * 0.002));
  requestRender();
}, { passive: false });

// ============================================================

// ============================================================
document.querySelectorAll('.brush-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.brush;
    if (mode === 'none') {

});

document.getElementById('brush-size').addEventListener('input', (e) => {
  brushSize = parseFloat(e.target.value);
  requestRender();
});

// ============================================================
// 9. 参数控制
// ============================================================
function bindSlider(id, key, formatter, scale) {
  const el = document.getElementById(id);
  const valEl = document.querySelector(`[data-value="${key}"]`);
  el.addEventListener('input', (e) => {
    state[key] = parseFloat(e.target.value);
    if (valEl) valEl.textContent = formatter(state[key]);
    updateHabitability();
    requestRender();
  });
  // 初始化
  state[key] = parseFloat(el.value);
  if (valEl) valEl.textContent = formatter(state[key]);
}

bindSlider('ctrl-temperature', 'temperature', v => `${v.toFixed(0)}°C`);
bindSlider('ctrl-atmosphere', 'atmosphere', v => `${v.toFixed(2)} atm`);
bindSlider('ctrl-gravity', 'gravity', v => `${v.toFixed(2)} g`);
bindSlider('ctrl-radiation', 'radiation', v => `${v.toFixed(0)}%`);
bindSlider('ctrl-spin', 'spinSpeed', v => `${v.toFixed(2)}×`);

// 元素滑杆
function bindGas(key) {
  const el = document.getElementById(`gas-${key}`);
  const valEl = document.querySelector(`[data-gas="${key}"]`);
  el.addEventListener('input', (e) => {
    const newVal = parseFloat(e.target.value);
    setGas(key, newVal);
    updateGasUI();
    updateHabitability();
  });
}

function setGas(key, value) {
  value = Math.max(GAS_MIN[key], Math.min(99, value));
  const others = Object.keys(state.gases).filter(k => k !== key);
  const othersSum = others.reduce((s, k) => s + state.gases[k], 0);
  const remaining = 100 - value;

  if (othersSum > 0.001) {
    const scale = remaining / othersSum;
    for (const k of others) {
      state.gases[k] = Math.max(GAS_MIN[k], state.gases[k] * scale);
    }
  }
  state.gases[key] = value;
  // 修正浮点误差到 N2
  const sum = Object.values(state.gases).reduce((a, b) => a + b, 0);
  state.gases.N2 = Math.max(GAS_MIN.N2, state.gases.N2 + (100 - sum));
}

function updateGasUI() {
  for (const k of Object.keys(state.gases)) {
    const el = document.getElementById(`gas-${k}`);
    const valEl = document.querySelector(`[data-gas="${k}"]`);
    if (el) el.value = state.gases[k];
    if (valEl) valEl.textContent = `${state.gases[k].toFixed(1)}%`;
  }
  const sum = Object.values(state.gases).reduce((a, b) => a + b, 0);
  document.getElementById('gas-sum-val').textContent = `${sum.toFixed(1)}%`;
}

['O2','N2','CO2','Ar'].forEach(bindGas);
updateGasUI();

// ============================================================
// 10. 维度计算
// ============================================================
function computeWaterRatio() {
  let sum = 0;
  for (let i = 0; i < TERRAIN_SIZE; i++) sum += terrainData[i];
  // 陆地比例（>128 视为陆地）
  return 1 - sum / (TERRAIN_SIZE * 255);
}

function oxygenScore(o2) {
  if (o2 < 12) return (o2 / 12) * 0.35;
  if (o2 < 21) return 0.6 + (o2 - 12) / 9 * 0.4;
  if (o2 < 30) return 1.0 - (o2 - 21) / 9 * 0.25;
  return Math.max(0.2, 0.75 - (o2 - 30) / 70 * 0.5);
}

function computeFragmentation() {
  // 统计地形边界密度
  let edges = 0;
  let samples = 0;
  for (let y = 2; y < TERRAIN_H - 2; y += 6) {
    for (let x = 2; x < TERRAIN_W - 2; x += 6) {
      const idx = y * TERRAIN_W + x;
      const v = terrainData[idx];
      samples++;
      if (Math.abs(terrainData[idx - 1] - v) > 100) edges++;
      if (Math.abs(terrainData[idx - TERRAIN_W] - v) > 100) edges++;
    }
  }
  return samples > 0 ? Math.min(edges / (samples * 1.2), 1) : 0;
}

function computeDimensions() {
  const dims = {};

  // 直接维度
  dims.temperature = 1 - Math.min(Math.abs(state.temperature - 15) / 100, 1);
  dims.water = computeWaterRatio();
  dims.atmosphere = 1 - Math.min(Math.abs(state.atmosphere - 1.0) / 3.0, 1);
  dims.oxygen = oxygenScore(state.gases.O2);
  dims.gravity = 1 - Math.min(Math.abs(state.gravity - 1.0) / 2.0, 1);
  dims.radiation = 1 - state.radiation / 100;

  // 推导维度
  // 磁场保护：重力 × 自转速度
  dims.magnetic = Math.min(1, state.gravity * state.spinSpeed * 0.4);

  // 昼夜温差：大气越厚、转得越快，温差越小
  const deltaT = 80 * (1 - Math.min(state.atmosphere / 5, 1)) * (1 - Math.min(state.spinSpeed / 3, 1) * 0.4) + 3;
  dims.tempVariation = 1 - Math.min(deltaT / 80, 1);

  // 光照强度：温度 + 辐射
  const lightLevel = (state.temperature + 80) / 200 * (1 + state.radiation / 100);
  dims.light = 1 - Math.min(Math.abs(lightLevel - 1.0) / 2, 1);

  // 地质稳定性：碎片越少越稳
  dims.geological = 1 - computeFragmentation();

  return dims;
}

// 权重（越重要的权重越大）
const WEIGHTS = {
  temperature: 1.2,
  water: 1.3,
  atmosphere: 1.0,
  oxygen: 1.5,
  gravity: 0.9,
  radiation: 1.0,
  magnetic: 0.8,
  tempVariation: 0.7,
  light: 0.6,
  geological: 0.7
};

const DIM_ORDER = ['temperature','water','atmosphere','oxygen','gravity','radiation',
                   'magnetic','tempVariation','light','geological'];

function computeHabitability() {
  const dims = computeDimensions();
  let product = 1;
  let sum = 0;
  for (const key of DIM_ORDER) {
    const w = WEIGHTS[key];
    product *= Math.pow(Math.max(dims[key], 0.001), w);
    sum += w;
  }
  return { score: Math.pow(product, 1 / sum), dims };
}

function habitabilityTier(score) {
  if (score >= 0.75) return { label: '宜居 · Earth-like', color: '#7cf0bd' };
  if (score >= 0.55) return { label: '勉强宜居 · Marginal', color: '#e6cca6' };
  if (score >= 0.35) return { label: '严酷 · Hostile', color: '#ff8fd8' };
  return { label: '致命 · Lethal', color: '#ff5c5c' };
}

// ============================================================
// 11. 更新 UI
// ============================================================
let chartValues = new Array(10).fill(0.5);
let chartTargetValues = new Array(10).fill(0.5);

function updateHabitability() {
  const { score, dims } = computeHabitability();
  const pct = Math.round(score * 100);

  const scoreEl = document.getElementById('hab-score');
  const tierEl = document.getElementById('hab-tier');
  const tier = habitabilityTier(score);

  scoreEl.textContent = pct;
  scoreEl.style.color = tier.color;
  scoreEl.style.textShadow = `0 0 40px ${tier.color}44`;
  tierEl.textContent = tier.label;
  tierEl.style.color = tier.color;
  tierEl.style.borderColor = tier.color + '66';
  tierEl.style.background = tier.color + '18';

  // 更新推导值
  updateDerivedUI(dims);

  // 更新图表目标值
  chartTargetValues = DIM_ORDER.map(k => dims[k]);
}

function updateDerivedUI(dims) {
  const derivedKeys = ['magnetic', 'tempVariation', 'light', 'geological'];
  for (const key of derivedKeys) {
    const el = document.querySelector(`[data-derived="${key}"]`);
    if (!el) continue;
    const numEl = el.querySelector('.dv-num');
    const arrowEl = el.querySelector('.derived-arrow');

    const newVal = dims[key];
    const oldVal = prevDerived[key];
    numEl.textContent = newVal.toFixed(2);

    if (Math.abs(newVal - oldVal) > 0.005) {
      arrowEl.classList.add('show', newVal > oldVal ? 'up' : 'down');
      arrowEl.textContent = newVal > oldVal ? '↑' : '↓';
      el.classList.add('flash');
      setTimeout(() => {
        arrowEl.classList.remove('show', 'up', 'down');
        el.classList.remove('flash');
      }, 800);
    }
    prevDerived[key] = newVal;
  }
}

// ============================================================
// 12. 粒子柱状图
// ============================================================
const chartCanvas = document.getElementById('chart-canvas');
const chartCtx = chartCanvas.getContext('2d');
const BAR_COUNT = 10;
const PARTICLES_PER_BAR = 90;

// 每个粒子的数据
const barParticles = [];
for (let i = 0; i < BAR_COUNT; i++) {
  const particles = [];
  for (let j = 0; j < PARTICLES_PER_BAR; j++) {
    particles.push({
      ox: (Math.random() - 0.5) * 0.75,     // -0.375 ~ 0.375（相对柱宽）
      normY: Math.random(),                  // 0 ~ 1（相对柱高）
      size: 1.0 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2,
      speed: 1.2 + Math.random() * 0.8
    });
  }
  barParticles.push(particles);
}

let chartAnimTime = 0;

function resizeChart() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = chartCanvas.getBoundingClientRect();
  chartCanvas.width = Math.round(rect.width * dpr);
  chartCanvas.height = Math.round(rect.height * dpr);
  chartCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawChart(dt) {
  const w = chartCanvas.clientWidth;
  const h = chartCanvas.clientHeight;
  if (w <= 0 || h <= 0) return;

  // 平滑更新
  for (let i = 0; i < BAR_COUNT; i++) {
    chartValues[i] += (chartTargetValues[i] - chartValues[i]) * Math.min(1, dt * 5);
  }
  chartAnimTime += dt;

  chartCtx.clearRect(0, 0, w, h);

  const padding = { top: 20, bottom: 28, left: 8, right: 8 };
  const innerW = w - padding.left - padding.right;
  const innerH = h - padding.top - padding.bottom;
  const barW = innerW / BAR_COUNT;
  const barInnerW = barW * 0.7;
  const barPad = (barW - barInnerW) / 2;
  const baseline = h - padding.bottom;

  for (let i = 0; i < BAR_COUNT; i++) {
    const value = chartValues[i];
    const barH = value * innerH;
    const x0 = padding.left + i * barW + barPad;
    const centerX = x0 + barInnerW / 2;

    // 颜色：前 6 直接，后 4 推导
    const isDerived = i >= 6;
    const baseColor = isDerived ? '205,168,125' : '141,148,255';

    // 背景轨道
    chartCtx.strokeStyle = `rgba(${baseColor}, 0.08)`;
    chartCtx.lineWidth = 1;
    chartCtx.strokeRect(x0, baseline - innerH, barInnerW, innerH);

    // 粒子
    const particles = barParticles[i];
    for (const p of particles) {
      const px = centerX + p.ox * barInnerW;
      const py = baseline - barH * p.normY;
      // 微小抖动
      const wobble = Math.sin(chartAnimTime * p.speed + p.phase) * 0.6;
      const alpha = 0.55 + 0.35 * Math.sin(chartAnimTime * 0.8 + p.phase);
      chartCtx.fillStyle = `rgba(${baseColor}, ${alpha})`;
      chartCtx.beginPath();
      chartCtx.arc(px + wobble * 0.5, py + wobble, p.size, 0, Math.PI * 2);
      chartCtx.fill();
    }

    // 底部标签
    chartCtx.fillStyle = 'rgba(220,214,255,0.55)';
    chartCtx.font = '10px "Fira Code", monospace';
    chartCtx.textAlign = 'center';
    chartCtx.fillText(LABELS_10[i], centerX, h - 8);
  }
}

let lastChartTime = performance.now();
function chartLoop(now) {
  requestAnimationFrame(chartLoop);
  const dt = Math.min((now - lastChartTime) / 1000, 0.05);
  lastChartTime = now;
  drawChart(dt);
}

// ============================================================
// 13. 保存 / 分享 / 重置
// ============================================================
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(text) {
  toastEl.textContent = text;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

function serializeState() {
  // 地形用 RLE 压缩
  const rle = [];
  let last = terrainData[0];
  let count = 1;
  for (let i = 1; i < TERRAIN_SIZE; i++) {
    if (terrainData[i] === last && count < 65535) {
      count++;
    } else {
      rle.push(last, count);
      last = terrainData[i];
      count = 1;
    }
  }
  rle.push(last, count);
  // base64 编码
  const bytes = new Uint8Array(rle.length * 2);
  for (let i = 0; i < rle.length; i++) {
    bytes[i * 2] = rle[i] & 0xff;
    bytes[i * 2 + 1] = (rle[i] >> 8) & 0xff;
  }
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  const terrainB64 = btoa(binary);

  return {
    version: 1,
    params: { ...state, gases: { ...state.gases } },
    camera: { yaw: camera.yaw, pitch: camera.pitch, distance: camera.distance },
    terrain: terrainB64
  };
}

function deserializeState(data) {
  if (!data || data.version !== 1) return false;
  try {
    // 参数
    Object.assign(state, data.params);
    if (data.params.gases) Object.assign(state.gases, data.params.gases);
    if (data.camera) Object.assign(camera, data.camera);

    // 地形
    const binary = atob(data.terrain);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const rle = [];
    for (let i = 0; i < bytes.length; i += 2) {
      rle.push(bytes[i] | (bytes[i + 1] << 8));
    }
    let idx = 0;
    for (let i = 0; i < rle.length; i += 2) {
      const v = rle[i];
      const count = rle[i + 1];
      for (let j = 0; j < count && idx < TERRAIN_SIZE; j++) {
        terrainData[idx++] = v;
      }
    }
    // 同步 UI
    document.getElementById('ctrl-temperature').value = state.temperature;
    document.getElementById('ctrl-atmosphere').value = state.atmosphere;
    document.getElementById('ctrl-gravity').value = state.gravity;
    document.getElementById('ctrl-radiation').value = state.radiation;
    document.getElementById('ctrl-spin').value = state.spinSpeed;
    document.querySelector('[data-value="temperature"]').textContent = `${state.temperature.toFixed(0)}°C`;
    document.querySelector('[data-value="atmosphere"]').textContent = `${state.atmosphere.toFixed(2)} atm`;
    document.querySelector('[data-value="gravity"]').textContent = `${state.gravity.toFixed(2)} g`;
    document.querySelector('[data-value="radiation"]').textContent = `${state.radiation.toFixed(0)}%`;
    document.querySelector('[data-value="spin"]').textContent = `${state.spinSpeed.toFixed(2)}×`;
    updateGasUI();
    uploadTerrain();
    updateHabitability();
    requestRender();
    return true;
  } catch (err) {
    console.error('Deserialize failed:', err);
    return false;
  }
}

document.getElementById('btn-save').addEventListener('click', () => {
  try {
    const data = serializeState();
    localStorage.setItem('patrick_planet_latest', JSON.stringify(data));
    showToast('✦ 星球已保存到本地');
  } catch (e) {
    showToast('✗ 保存失败：' + e.message);
  }
});

document.getElementById('btn-share').addEventListener('click', async () => {
  try {
    const data = serializeState();
    const json = JSON.stringify(data);
    // 压缩 base64
    const b64 = btoa(unescape(encodeURIComponent(json)));
    const url = location.origin + location.pathname + '#' + b64;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(url);
      showToast('✦ 分享链接已复制到剪贴板');
    } else {
      // 兜底
      const input = document.createElement('input');
      input.value = url;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      input.remove();
      showToast('✦ 分享链接已复制');
    }
  } catch (e) {
    showToast('✗ 分享失败：' + e.message);
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('确定要重置星球吗？当前所有修改将丢失。')) return;
  generateDefaultTerrain();
  uploadTerrain();
  state.temperature = 15;
  state.atmosphere = 1.0;
  state.gravity = 1.0;
  state.radiation = 12;
  state.spinSpeed = 1.0;
  state.gases = { O2: 21, N2: 78, CO2: 0.04, Ar: 0.92 };
  document.getElementById('ctrl-temperature').value = 15;
  document.getElementById('ctrl-atmosphere').value = 1.0;
  document.getElementById('ctrl-gravity').value = 1.0;
  document.getElementById('ctrl-radiation').value = 12;
  document.getElementById('ctrl-spin').value = 1.0;
  updateGasUI();
  updateHabitability();
  requestRender();
  showToast('↻ 星球已重置');
});

// ============================================================
// 14. 初始化
// ============================================================
generateDefaultTerrain();
uploadTerrain();

// 尝试从 URL hash 恢复
if (location.hash.length > 1) {
  try {
    const b64 = location.hash.slice(1);
    const json = decodeURIComponent(escape(atob(b64)));
    const data = JSON.parse(json);
    if (deserializeState(data)) {
      showToast('✦ 已从分享链接恢复星球');
    }
  } catch (e) {
    console.warn('Failed to load from hash:', e);
  }
} else {
  // 尝试从 localStorage 恢复最新一次
  try {
    const saved = localStorage.getItem('patrick_planet_latest');
    if (saved) {
      const data = JSON.parse(saved);
      // 不自动恢复，等用户点"保存"才生效
      // 如果要自动恢复，取消下面注释：
      // deserializeState(data);
    }
  } catch (e) {}
}

updateHabitability();
requestRender();
resizeChart();
window.addEventListener('resize', () => { resizeChart(); requestRender(); });

requestAnimationFrame(loop);
requestAnimationFrame(chartLoop);

// 首屏淡入
document.body.style.opacity = '0';
document.body.style.transition = 'opacity 0.8s ease';
requestAnimationFrame(() => {
  document.body.style.opacity = '1';
});

})();
</script>
<!-- 👇 转场动画脚本 -->
<script>
(function() {
    const canvas = document.getElementById('noise-transition-canvas');
    const btnBack = document.getElementById('btn-back');
    if (!canvas) return;
    const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true });
    if (!gl) { document.body.style.opacity = '1'; canvas.style.display = 'none'; return; }

    const vsSource = `#version 300 es
    in vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;
    
    const fsSource = `#version 300 es
    precision highp float; uniform vec2 uRes; uniform float uProgress; uniform float uTime; out vec4 outColor;
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
    float snoise(vec3 v) { 
        const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy) ); vec3 x0 = v - i + dot(i, C.xxx) ;
        vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g; vec3 i1 = min( g.xyz, l.zxy ); vec3 i2 = max( g.xyz, l.zxy );
        vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy; i = mod289(i); 
        vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
        float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z); vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_ );
        vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4( x.xy, y.xy ); vec4 b1 = vec4( x.zw, y.zw );
        vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
        vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w);
        vec4 norm = 1.79284291400159 - 0.85373472095314 * vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m;
        return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
    }
    void main() {
        vec2 uv = gl_FragCoord.xy / uRes; uv.x *= uRes.x / uRes.y;
        vec3 coord = vec3(uv * 3.0, uTime * 0.6);
        float n = snoise(coord) + snoise(coord * 2.0) * 0.5;
        n = n * 0.5 + 0.5;
        float mask = smoothstep(uProgress - 0.4, uProgress + 0.4, n);
        float edge = smoothstep(uProgress - 0.05, uProgress, n) - smoothstep(uProgress, uProgress + 0.05, n);
        vec3 col = vec3(0.05, 0.02, 0.15) + vec3(0.6, 0.4, 1.0) * edge * 0.8;
        outColor = vec4(col, mask);
    }`;

    function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSource));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, 'uRes');
    const uProgress = gl.getUniformLocation(prog, 'uProgress');
    const uTime = gl.getUniformLocation(prog, 'uTime');

    let isLeaving = false;
    let progress = 1.0;
    let startTime = performance.now();
    let rafId = 0;
    let started = false;

    function render(now) {
        if (!started) { startTime = now; started = true; }
        const elapsed = (now - startTime) / 1000;
        
        if (!isLeaving) {
            progress = Math.max(0, 1.2 - elapsed * 1.5); // 进场：0.8秒散开
        } else {
            progress = Math.min(1.2, elapsed * 1.5); // 退场：0.8秒遮住
        }

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (canvas.width !== window.innerWidth * dpr) {
            canvas.width = window.innerWidth * dpr; canvas.height = window.innerHeight * dpr;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }

        gl.useProgram(prog);
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uProgress, progress);
        gl.uniform1f(uTime, elapsed + 10.0);
        
        gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3);

        if (!isLeaving && progress === 0) {
            canvas.style.pointerEvents = 'none';
            canvas.style.opacity = '0';
            return; // 动画结束停止渲染
        }

        if (isLeaving && progress >= 1.2) {
            window.location.href = 'index.html';
            return;
        }

        rafId = requestAnimationFrame(render);
    }

    if (btnBack) {
        btnBack.addEventListener('click', (e) => {
            e.preventDefault();
            if (isLeaving) return;
            isLeaving = true;
            started = false;
            canvas.style.pointerEvents = 'auto';
            canvas.style.opacity = '1';
            rafId = requestAnimationFrame(render);
        });
    }

    rafId = requestAnimationFrame(render);
})();
</script>
