<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet Lab — Patrick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Fira+Code:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f4f2ff;
  --ink-2: rgba(236,232,255,.72);
  --ink-3: rgba(220,214,255,.5);
  --peri: #6f78ff;
  --peri-2: #8d94ff;
  --bronze: #cda87d;
  --frost: #dbe4ee;
  --bg: #000000;
  --bg-2: #14103a;
  --line: rgba(196,178,255,.15);
  --glass: rgba(20,13,56,.55);
  --glass-strong: rgba(20,13,56,.85);
  --accent-glow: rgba(141,148,255,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter Tight', system-ui, sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'Fira Code', monospace; }
.serif { font-family: 'Instrument Serif', serif; font-style: italic; }

/* 顶部导航 */
header.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 18px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(13,8,48,.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 13px;
  transition: color .25s;
}
.back-link:hover { color: var(--frost); }
.back-link svg { width: 14px; height: 14px; }
.page-title {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 22px;
  letter-spacing: .02em;
  background: linear-gradient(90deg, #a5b8ff, #d4a7ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.top-actions { display: flex; gap: 10px; }
.top-btn {
  background: rgba(111,120,255,.12);
  border: 1px solid rgba(141,148,255,.28);
  color: var(--frost);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-family: 'Fira Code', monospace;
  letter-spacing: .04em;
  cursor: pointer;
  transition: all .25s;
}
.top-btn:hover {
  background: rgba(111,120,255,.25);
  box-shadow: 0 0 18px var(--accent-glow);
}
.top-btn.primary {
  background: linear-gradient(135deg, rgba(111,120,255,.4), rgba(205,168,125,.25));
  border-color: rgba(205,168,125,.45);
}
.top-btn.primary:hover {
  background: linear-gradient(135deg, rgba(111,120,255,.55), rgba(205,168,125,.4));
  box-shadow: 0 0 24px rgba(205,168,125,.4);
}

/* 主体三栏 */
main.lab {
  max-width: 1600px;
  margin: 0 auto;
  padding: 24px 32px 120px;
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(320px, 1fr);
  grid-template-rows: auto auto;
  gap: 24px;
}

/* 卡片通用 */
.panel {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: 16px;
  backdrop-filter: blur(20px) saturate(1.3);
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.04);
  overflow: hidden;
}
.panel-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-title {
  font-size: 11px;
  font-family: 'Fira Code', monospace;
  letter-spacing: .14em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.panel-body { padding: 20px; }

/* 左侧：星球 */
#planet-panel { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; }
#planet-stage {
  position: relative;
  aspect-ratio: 1 / 1;
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}
#planet-canvas {
  width: 100%;
  height: 100%;
  display: block;
  border-radius: 50%;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
#planet-canvas.painting { cursor: crosshair; }
#planet-canvas.grabbing { cursor: grabbing; }

/* 工具栏 */
.brush-bar {
  padding: 12px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.brush-btn {
  background: rgba(111,120,255,.08);
  border: 1px solid rgba(141,148,255,.2);
  color: var(--ink-2);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 12px;
  font-family: 'Fira Code', monospace;
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.brush-btn:hover { color: var(--frost); border-color: rgba(141,148,255,.5); }
.brush-btn.active {
  background: rgba(111,120,255,.3);
  border-color: var(--peri-2);
  color: #fff;
  box-shadow: 0 0 16px var(--accent-glow);
}
.brush-btn.danger.active {
  background: rgba(255,120,150,.22);
  border-color: rgba(255,120,150,.6);
  box-shadow: 0 0 16px rgba(255,120,150,.4);
}
.brush-btn.gold.active {
  background: rgba(205,168,125,.25);
  border-color: var(--bronze);
  box-shadow: 0 0 16px rgba(205,168,125,.4);
}
.brush-size {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--ink-3);
  font-family: 'Fira Code', monospace;
}
.brush-size input[type="range"] { width: 100px; }

/* 右侧：控制 */
#controls-panel { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; max-height: 700px; }
#controls-body { overflow-y: auto; flex: 1; }
#controls-body::-webkit-scrollbar { width: 4px; }
#controls-body::-webkit-scrollbar-thumb { background: rgba(205,190,255,.2); border-radius: 2px; }

.control-group { margin-bottom: 24px; }
.control-group-title {
  font-size: 10px;
  font-family: 'Fira Code', monospace;
  letter-spacing: .12em;
  color: var(--ink-3);
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.control-group-title::before {
  content: '';
  display: block;
  width: 3px;
  height: 10px;
  background: var(--peri-2);
  border-radius: 2px;
}
.control-group-title.derived::before { background: var(--bronze); }

.ctrl-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}
.ctrl-label {
  font-size: 12px;
  color: var(--ink-2);
  min-width: 88px;
}
.ctrl-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 4px;
  border-radius: 2px;
  background: rgba(205,190,255,.12);
  outline: none;
  cursor: pointer;
}
.ctrl-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--peri-2);
  box-shadow: 0 0 12px var(--peri-2);
  cursor: grab;
  transition: transform .15s;
}
.ctrl-row input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }
.ctrl-row input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--peri-2);
  border: none;
  box-shadow: 0 0 12px var(--peri-2);
}
.ctrl-value {
  font-family: 'Fira Code', monospace;
  font-size: 12px;
  color: var(--frost);
  min-width: 70px;
  text-align: right;
  transition: color .2s;
}

/* 元素混合器 */
.gas-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.gas-label {
  font-size: 12px;
  font-family: 'Fira Code', monospace;
  color: var(--ink-2);
  min-width: 40px;
}
.gas-row input[type="range"] { flex: 1; }
.gas-value {
  font-family: 'Fira Code', monospace;
  font-size: 11px;
  color: var(--frost);
  min-width: 56px;
  text-align: right;
}
.gas-sum {
  display: flex;
  justify-content: space-between;
  padding-top: 8px;
  margin-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 11px;
  font-family: 'Fira Code', monospace;
  color: var(--ink-3);
}

/* 推导值 */
.derived-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.derived-item {
  background: rgba(205,168,125,.06);
  border: 1px solid rgba(205,168,125,.2);
  border-radius: 10px;
  padding: 12px;
  position: relative;
  transition: all .3s;
}
.derived-item.flash {
  background: rgba(205,168,125,.16);
  border-color: var(--bronze);
  box-shadow: 0 0 20px rgba(205,168,125,.3);
}
.derived-label {
  font-size: 10px;
  color: var(--ink-3);
  font-family: 'Fira Code', monospace;
  letter-spacing: .05em;
}
.derived-value {
  font-size: 18px;
  color: var(--bronze);
  font-family: 'Fira Code', monospace;
  margin-top: 4px;
  display: flex;
  align-items: baseline;
  gap: 4px;
}
.derived-arrow {
  font-size: 11px;
  opacity: 0;
  transition: opacity .3s;
}
.derived-arrow.show { opacity: 1; }
.derived-arrow.up { color: #7cf0bd; }
.derived-arrow.down { color: #ff8fd8; }

/* 底部宜居度 + 沙粒图 */
#bottom-panel {
  grid-column: 1 / -1;
  grid-row: 2;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 0;
}
.habitability-block {
  padding: 28px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.habitability-label {
  font-family: 'Fira Code', monospace;
  font-size: 10px;
  letter-spacing: .15em;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.habitability-score {
  font-size: 64px;
  font-weight: 300;
  line-height: 1;
  color: var(--frost);
  transition: color .4s;
}
.habitability-tier {
  margin-top: 10px;
  display: inline-block;
  padding: 6px 14px;
  border-radius: 20px;
  font-family: 'Fira Code', monospace;
  font-size: 11px;
  letter-spacing: .05em;
  border: 1px solid;
  align-self: flex-start;
  transition: all .3s;
}
.chart-block { padding: 20px; }
#chart-canvas { width: 100%; height: 220px; display: block; }

/* Toast */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--glass-strong);
  border: 1px solid rgba(205,190,255,.4);
  color: var(--frost);
  padding: 12px 26px;
  border-radius: 12px;
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  letter-spacing: .08em;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 12px 40px rgba(110,90,240,.5);
  transition: all .35s cubic-bezier(.2,.8,.2,1);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 移动端 */
@media (max-width: 980px) {
  main.lab { grid-template-columns: 1fr; padding: 16px 16px 80px; }
  #planet-panel { grid-row: 1; }
  #controls-panel { grid-row: 2; max-height: none; }
  #bottom-panel { grid-row: 3; grid-template-columns: 1fr; }
  .habitability-block { border-right: none; border-bottom: 1px solid var(--line); }
  header.top-bar { padding: 14px 18px; }
  .page-title { font-size: 18px; }
  .top-btn { padding: 6px 12px; font-size: 11px; }
  .habitability-score { font-size: 52px; }
}
  /* 👇 转场遮罩样式 */
#noise-transition-canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 9999999; pointer-events: auto;
}
.back-link {
    cursor: pointer; background: none; border: none; font-family: inherit;
}
  /* =========================================================
   Ultra 极客风黑金主题与全新滑杆
   ========================================================= */
:root {
  --bg: #000000 !important; /* 强制纯黑背景 */

  --ink-2: rgba(255, 255, 255, 0.8);
  --ink-3: rgba(255, 255, 255, 0.5);
  --bronze: #d4af37; /* 香槟金 */
}

body {
  background: #000000 !important;
}

/* 锁定按钮样式 */
.lock-btn {
  background: none;
  border: none;
  font-size: 14px;
  cursor: pointer;
  padding: 0 8px;
  opacity: 0.5;
  transition: all 0.2s;
  filter: grayscale(1);
}
.lock-btn:hover {
  opacity: 0.9;
  filter: grayscale(0);
}
/* 锁定时的发光效果 */
.lock-btn.locked {
  opacity: 1;
  filter: grayscale(0) drop-shadow(0 0 6px rgba(255, 215, 0, 0.8));
}

/* 气体行布局微调 */
.gas-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.gas-row input[type="range"] {
  flex: 1;
  margin: 0 10px;
}
.gas-value {
  font-family: 'Fira Code', monospace;
  font-size: 13px;
  color: #fff;
  min-width: 60px;
  text-align: right;
}

/* 完美的白轨+高亮滑块样式 */
input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  background: transparent;
  height: 20px;
}
input[type="range"]:focus {
  outline: none;
}
/* 轨道 (纯白) */
input[type="range"]::-webkit-slider-runnable-track {
  width: 100%;
  height: 4px;
  cursor: pointer;
  background: #ffffff;
  border-radius: 2px;
}
/* 滑块 (亮蓝色) */
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  height: 14px;
  width: 14px;
  border-radius: 50%;
  background: #3b82f6;
  box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
  cursor: pointer;
  margin-top: -5px;
  transition: transform 0.1s;
}
input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}
/* 滑杆禁用状态（锁定后） */
input[type="range"]:disabled::-webkit-slider-runnable-track {
  background: rgba(255, 255, 255, 0.2);
}
input[type="range"]:disabled::-webkit-slider-thumb {
  background: #666;
  box-shadow: none;
}

<body>
      <canvas id="noise-transition-canvas"></canvas>

<header class="top-bar">
<!-- 👇 把原来的 <a> 换成 <button>，加上 id="btn-back" -->
<button id="btn-back" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Home
</button>
  <div class="page-title">Planet Lab · 星球实验室</div>
  <div class="top-actions">
    <button class="top-btn" id="btn-reset">重置</button>
    <button class="top-btn" id="btn-save">保存</button>
    <button class="top-btn primary" id="btn-share">分享</button>
  </div>
</header>

<main class="lab">

  <!-- 左侧：星球渲染 -->
  <section class="panel" id="planet-panel">
    <div class="panel-head">
      <span class="panel-title">Planet · 星球</span>
      <span class="mono" style="font-size:10px; color:var(--ink-3);" id="planet-status">点击星球绘制 · 右键或拖拽旋转视角</span>
    </div>
    <div id="planet-stage">
      <canvas id="planet-canvas"></canvas>
    </div>
  </section>

  <!-- 右侧：控制面板 -->
  <section class="panel" id="controls-panel">
    <div class="panel-head">
      <span class="panel-title">Control · 参数</span>
    </div>
    <div class="panel-body" id="controls-body">

      <!-- 直接控制 -->
      <div class="control-group">
        <div class="control-group-title">直接控制 · Direct</div>

        <div class="ctrl-row">
          <span class="ctrl-label">表面温度</span>
          <input type="range" id="ctrl-temperature" min="-80" max="200" step="1" value="15">
          <span class="ctrl-value" data-value="temperature">15°C</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">大气压力</span>
          <input type="range" id="ctrl-atmosphere" min="0" max="5" step="0.05" value="1">
          <span class="ctrl-value" data-value="atmosphere">1.00 atm</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">表面重力</span>
          <input type="range" id="ctrl-gravity" min="0.1" max="3" step="0.05" value="1">
          <span class="ctrl-value" data-value="gravity">1.00 g</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">辐射水平</span>
          <input type="range" id="ctrl-radiation" min="0" max="100" step="1" value="12">
          <span class="ctrl-value" data-value="radiation">12%</span>
        </div>

        <div class="ctrl-row">
          <span class="ctrl-label">自转速度</span>
          <input type="range" id="ctrl-spin" min="0" max="3" step="0.05" value="1">
          <span class="ctrl-value" data-value="spin">1.00×</span>
        </div>
      </div>

      <!-- 元素 DIY -->
            <!-- 元素 DIY -->
      <div class="control-group">
        <div class="control-group-title">大气成分 · Atmosphere Mix</div>

        <div class="gas-row">
          <span class="gas-label">O₂</span>
          <button class="lock-btn" data-lock="O2">🔓</button>
          <input type="range" id="gas-O2" min="0" max="99" step="0.1" value="21">
          <span class="gas-value" data-gas="O2">21.0%</span>
        </div>
        <div class="gas-row">
          <span class="gas-label">N₂</span>
          <button class="lock-btn" data-lock="N2">🔓</button>
          <input type="range" id="gas-N2" min="0" max="99" step="0.1" value="78">
          <span class="gas-value" data-gas="N2">78.0%</span>
        </div>
        <div class="gas-row">
          <span class="gas-label">CO₂</span>
          <button class="lock-btn" data-lock="CO2">🔓</button>
          <input type="range" id="gas-CO2" min="0" max="99" step="0.1" value="0.04">
          <span class="gas-value" data-gas="CO2">0.0%</span>
        </div>
        <div class="gas-row">
          <span class="gas-label">Ar</span>
          <button class="lock-btn" data-lock="Ar">🔓</button>
          <input type="range" id="gas-Ar" min="0" max="99" step="0.1" value="0.92">
          <span class="gas-value" data-gas="Ar">0.9%</span>
        </div>

        <div class="gas-sum">
          <span>总和</span>
          <span id="gas-sum-val">100.0%</span>
        </div>
      </div>


      <!-- 联动推导 -->
      <div class="control-group">

          <div class="derived-item" data-derived="magnetic">
            <div class="derived-label">磁场保护</div>
            <div class="derived-value">
              <span class="dv-num">0.00</span>
              <span class="derived-arrow">↑</span>
            </div>
          </div>
          <div class="derived-item" data-derived="tempVariation">
            <div class="derived-label">昼夜温差</div>
            <div class="derived-value">
              <span class="dv-num">0.00</span>
              <span class="derived-arrow">↑</span>
            </div>
          </div>
          <div class="derived-item" data-derived="light">
            <div class="derived-label">光照强度</div>
            <div class="derived-value">
              <span class="dv-num">0.00</span>
              <span class="derived-arrow">↑</span>
            </div>
          </div>
          <div class="derived-item" data-derived="geological">
            <div class="derived-label">地质稳定</div>
            <div class="derived-value">
              <span class="dv-num">0.00</span>
              <span class="derived-arrow">↑</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- 底部：宜居度 + 沙粒柱状图 -->
  <section class="panel" id="bottom-panel">
    <div class="habitability-block">
      <div class="habitability-label">HABITABILITY INDEX</div>
      <div class="habitability-score" id="hab-score">—</div>
      <div class="habitability-tier" id="hab-tier">—</div>
    </div>
    <div class="chart-block">
      <canvas id="chart-canvas"></canvas>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
(function() {
'use strict';

// 状态
const state = {
  temperature: 15, atmosphere: 1.0, gravity: 1.0, radiation: 12, spinSpeed: 1.0,
  gases: { O2: 21, N2: 78, CO2: 0.04, Ar: 0.92 }
};
const GAS_MIN = { O2: 0.01, N2: 0.01, CO2: 0.01, Ar: 0.01 };
const gasLocks = { O2: false, N2: false, CO2: false, Ar: false };

const camera = { yaw: 0, pitch: 0.15, distance: 2.8, fov: 45 };
let autoRotate = true;
const AUTO_ROTATE_SPEED = 0.12;

// 生成地形贴图数据（只为点阵轮廓服务）
const TERRAIN_W = 512; const TERRAIN_H = 256;
const terrainData = new Uint8Array(TERRAIN_W * TERRAIN_H);
for (let y = 0; y < TERRAIN_H; y++) {
  const lat = (y / TERRAIN_H) * Math.PI - Math.PI / 2;
  const cosLat = Math.cos(lat);
  for (let x = 0; x < TERRAIN_W; x++) {
    const lon = (x / TERRAIN_W) * Math.PI * 2;
    const n1 = Math.sin(lon * 3 + 1.2) * Math.cos(lat * 4 + 0.5);
    const n2 = Math.sin(lon * 5 - 2.1) * Math.cos(lat * 3 + 1.8);
    const n3 = Math.sin(lon * 2 + 0.7) * Math.cos(lat * 6);
    const noise = (n1 + n2 * 0.6 + n3 * 0.4) / 2.0;
    terrainData[y * TERRAIN_W + x] = (noise > 0.08 && Math.abs(cosLat) > 0.12) ? 255 : 0;
  }
}

// WebGL 初始化
const canvas = document.getElementById('planet-canvas');
const gl = canvas.getContext('webgl2', { alpha: true, antialias: true });
if (!gl) return;

const VS_SRC = `#version 300 es
in vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS_SRC = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform sampler2D uTerrain; uniform vec2 uRot;
out vec4 outColor;
const float PI = 3.14159265; const float TAU = 6.28318530;
mat2 rot2(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float ringIntersection(vec3 ro, vec3 rd, vec3 normal, float radius, float thickness) {
    float denom = dot(rd, normal);
    if (abs(denom) < 1e-5) return 0.0;
    float t = -dot(ro, normal) / denom;
    if (t < 0.0) return 0.0;
    vec3 p = ro + rd * t;
    return smoothstep(thickness, 0.0, abs(length(p) - radius));
}
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = (uv - 0.5) * 2.0;
  p.x *= uRes.x / uRes.y;
  float R = 0.82; float d2 = dot(p, p);
  vec3 color = vec3(0.0);
  vec3 ro = vec3(0.0, 0.0, 3.0); 
  vec3 rd = normalize(vec3(p.x * 0.4, p.y * 0.4, -1.0));

  vec3 ringNormal1 = normalize(vec3(0.4, 0.6, 0.2));
  color += vec3(0.8, 0.1, 0.5) * ringIntersection(ro, rd, ringNormal1, 1.25, 0.015) * 1.5;
  vec3 ringNormal2 = normalize(vec3(-0.3, 0.5, 0.6));
  color += vec3(0.3, 0.5, 0.8) * ringIntersection(ro, rd, ringNormal2, 1.4, 0.01) * 0.8;

  if (d2 > R * R) {
    color += vec3(0.5, 0.2, 0.8) * exp(-(sqrt(d2) - R) * 15.0) * 0.4;
    outColor = vec4(color, 1.0);
    return;
  }
  float z = sqrt(R * R - d2);
  vec3 normal = normalize(vec3(p, z));
  normal.xz = rot2(uRot.x) * normal.xz;
  normal.yz = rot2(uRot.y) * normal.yz;
  vec2 sphereUV = vec2(atan(normal.z, normal.x) / TAU + 0.5, asin(clamp(normal.y, -1.0, 1.0)) / PI + 0.5);
  float land = texture(uTerrain, sphereUV).r;
  color += vec3(0.6, 0.4, 1.0) * pow(1.0 - z / R, 3.0) * 0.3; 

  if (land > 0.5) {
    vec2 grid = sphereUV * vec2(350.0, 175.0); 
    vec2 f = fract(grid);
    float dotMask = smoothstep(0.2, 0.1, distance(f, vec2(0.5))); 
    float edgeFade = smoothstep(0.0, 0.3, z / R); 
    color += vec3(1.0) * dotMask * edgeFade * 0.8; 
  }
  outColor = vec4(color, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS_SRC));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS_SRC));
gl.linkProgram(prog); gl.useProgram(prog);

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uTime','uTerrain','uRot'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

const terrainTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, terrainTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, TERRAIN_W, TERRAIN_H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, terrainData);

// 交互逻辑
let isDragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', (e) => { isDragging = true; lastX = e.clientX; lastY = e.clientY; autoRotate = false; });
canvas.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  camera.yaw += (e.clientX - lastX) * 0.008;
  camera.pitch = Math.max(-1.2, Math.min(1.2, camera.pitch + (e.clientY - lastY) * 0.008));
  lastX = e.clientX; lastY = e.clientY; needsRender = true;
});
window.addEventListener('pointerup', () => { isDragging = false; autoRotate = true; });

let needsRender = true, lastTime = performance.now(), timeAccum = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 1000, 0.05); lastTime = now; timeAccum += dt;
  if (autoRotate && !isDragging) { camera.yaw += AUTO_ROTATE_SPEED * state.spinSpeed * dt; needsRender = true; }
  if (needsRender) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    
    gl.useProgram(prog); gl.bindVertexArray(vao);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, timeAccum);
    gl.uniform2f(U.uRot, camera.yaw, camera.pitch);
    gl.uniform1i(U.uTerrain, 0); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, terrainTex);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    needsRender = false;
  }
}

// 面板逻辑
function bindSlider(id, key, formatter) {
  const el = document.getElementById(id); const valEl = document.querySelector(`[data-value="${key}"]`);
  el.addEventListener('input', (e) => { state[key] = parseFloat(e.target.value); if (valEl) valEl.textContent = formatter(state[key]); });
  state[key] = parseFloat(el.value); if (valEl) valEl.textContent = formatter(state[key]);
}
bindSlider('ctrl-temperature', 'temperature', v => `${v.toFixed(0)}°C`);
bindSlider('ctrl-atmosphere', 'atmosphere', v => `${v.toFixed(2)} atm`);
bindSlider('ctrl-gravity', 'gravity', v => `${v.toFixed(2)} g`);
bindSlider('ctrl-radiation', 'radiation', v => `${v.toFixed(0)}%`);
bindSlider('ctrl-spin', 'spinSpeed', v => `${v.toFixed(2)}×`);

document.querySelectorAll('.lock-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    const key = e.target.dataset.lock;
    gasLocks[key] = !gasLocks[key];
    e.target.textContent = gasLocks[key] ? '🔒' : '🔓';
    e.target.classList.toggle('locked', gasLocks[key]);
    document.getElementById(`gas-${key}`).disabled = gasLocks[key];
  });
});

function bindGas(key) {
  const el = document.getElementById(`gas-${key}`);
  el.addEventListener('input', (e) => { setGas(key, parseFloat(e.target.value), el); updateGasUI(); });
}

function setGas(key, value, el) {
  value = Math.max(GAS_MIN[key], Math.min(99, value));
  const others = Object.keys(state.gases).filter(k => k !== key);
  let lockedSum = 0; others.forEach(k => { if (gasLocks[k]) lockedSum += state.gases[k]; });
  let remaining = 100 - value - lockedSum;
  if (remaining < 0) { value = 100 - lockedSum; remaining = 0; if (el) el.value = value; }
  
  const unlockedOthers = others.filter(k => !gasLocks[k]);
  if (unlockedOthers.length > 0) {
    const unlockedSum = unlockedOthers.reduce((sum, k) => sum + state.gases[k], 0);
    if (unlockedSum > 0.001) {
      const scale = remaining / unlockedSum;
      for (const k of unlockedOthers) state.gases[k] = Math.max(GAS_MIN[k], state.gases[k] * scale);
    } else {
      const share = remaining / unlockedOthers.length;
      for (const k of unlockedOthers) state.gases[k] = Math.max(GAS_MIN[k], share);
    }
  }
  state.gases[key] = value;
  const sum = Object.values(state.gases).reduce((a, b) => a + b, 0);
  const diff = 100 - sum;
  if (Math.abs(diff) > 0.0001) {
    const absorber = unlockedOthers.length > 0 ? unlockedOthers[0] : key;
    state.gases[absorber] += diff;
  }
}

function updateGasUI() {
  for (const k of Object.keys(state.gases)) {
    const el = document.getElementById(`gas-${k}`); const valEl = document.querySelector(`[data-gas="${k}"]`);
    if (el) el.value = state.gases[k];
    if (valEl) valEl.textContent = `${state.gases[k].toFixed(1)}%`;
  }
  document.getElementById('gas-sum-val').textContent = `${Object.values(state.gases).reduce((a, b) => a + b, 0).toFixed(1)}%`;
}

['O2','N2','CO2','Ar'].forEach(bindGas);
updateGasUI();

// 返回按钮直接跳转（精简版）
const btnBack = document.getElementById('btn-back');
if (btnBack) btnBack.addEventListener('click', () => { window.location.href = 'index.html'; });

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
